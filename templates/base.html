<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AIC速報{% endblock %}</title>
<!-- GA4: 計測ID取得後に差し替え
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');
</script>
-->
<style>
  :root { --accent: #2b6cb0; --bg: #f7f8fa; --card: #fff; --text: #222; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.7; }
  header { background: var(--accent); color: #fff; padding: 14px 16px; }
  header a { color: #fff; text-decoration: none; font-weight: bold; font-size: 1.2em; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: 8px; padding: 16px 20px;
          margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .meta { color: #666; font-size: .85em; }
  .cat { display: inline-block; background: var(--accent); color: #fff;
         border-radius: 4px; padding: 1px 8px; font-size: .8em; margin-right: 8px; }
  .comment { border-bottom: 1px solid #eee; padding: 10px 0; }
  .comment b { color: #228822; font-size: .9em; }
  .disclosure-small { font-size: 8pt; color: #999; margin: 4px 0; }
  .comment p { margin: 4px 0 0; }
  .ad { background: #eee; color: #999; text-align: center; padding: 30px 0;
        margin: 16px 0; border-radius: 6px; font-size: .85em; }
  footer { text-align: center; color: #888; font-size: .8em; padding: 24px 0; }
  h1 { font-size: 1.4em; line-height: 1.4; }
  ul.points li { margin-bottom: 4px; }
  .index-item a { text-decoration: none; color: var(--text); font-weight: bold; }
  .index-item a:hover { color: var(--accent); }
</style>
</head>
<body>
<header><a href="index.html">AIC速報</a></header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <p class="disclosure-small">※当サイトのコメントはすべてAIが生成したものです。実在の人物・団体の意見ではありません。</p>
  <p class="disclosure-small">出典記事の著作権は各報道機関に帰属します。</p>
</footer>
</body>
</html>
