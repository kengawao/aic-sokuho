<script>
// ブラウザ言語/保存済みの選択に応じて日英ページを自動振り分け
(function(){
  var alt = "";
  var lang = "ja";
  if (!alt) return;
  var pref = null;
  try { pref = localStorage.getItem("aic_lang"); } catch(e) {}
  var isJa = (navigator.language || "").toLowerCase().indexOf("ja") === 0;
  if (pref) {
    if (pref !== lang) location.replace(alt);
  } else {
    if (lang === "ja" && !isJa) location.replace(alt);
    if (lang === "en" && isJa) location.replace(alt);
  }
})();
</script>
